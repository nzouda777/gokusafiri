services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        APP_ENV: local
    volumes:
      - .:/var/www
    environment:
      - APP_ENV=local
    depends_on:
      - db
      - redis
    networks:
      - gokusafiri

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - gokusafiri

  db:
    image: mysql:8
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: gokusafiri
      MYSQL_USER: gokusafiri
      MYSQL_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - gokusafiri

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gokusafiri

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan horizon
    volumes:
      - .:/var/www
    depends_on:
      - db
      - redis
    networks:
      - gokusafiri

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan schedule:work
    volumes:
      - .:/var/www
    depends_on:
      - db
      - redis
    networks:
      - gokusafiri

  node:
    image: node:22-alpine
    working_dir: /var/www
    command: npm run dev
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www
    networks:
      - gokusafiri

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - gokusafiri

volumes:
  db_data:
  redis_data:

networks:
  gokusafiri:
    driver: bridge
