services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
      args:
        APP_ENV: production
    environment:
      - APP_ENV=production
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=0
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - gokusafiri

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - app_public:/var/www/public
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - gokusafiri

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - gokusafiri

  redis:
    image: redis:alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - gokusafiri

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    command: php artisan horizon
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - gokusafiri
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      retries: 3

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    command: php artisan schedule:work
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - gokusafiri

volumes:
  db_data:
  redis_data:
  app_public:

networks:
  gokusafiri:
    driver: bridge
